<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What is an agent? — Koppla demo</title>
<style>
  :root {
    --bg: #F5F7F9; --card: #FFFFFF; --line: #D9E1E8; --ink: #1B2733; --muted: #52616E;
    --think: #1E5FA8; --think-bg: #EEF4FB; --think-line: #B7CFE8;
    --act: #B65108; --act-bg: #FDF4EA; --act-line: #EBCBA4;
    --obs: #217A46; --obs-bg: #EEF7F1; --obs-line: #BFDCCA;
    --done-bg: #1E5FA8; --done-ink: #FFFFFF; --done-tag: #A9C7EC;
    --err: #B3261E; --err-bg: #FBEDEB; --err-line: #E5B6B1;
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; line-height: 1.5; }
  #app { max-width: 1600px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }

  header { display: flex; justify-content: space-between; gap: 1.5rem; align-items: flex-start;
           padding-bottom: 0.9rem; border-bottom: 1.5px solid var(--line); }
  .goal { max-width: 62%; font-size: 1.05rem; font-weight: 500; text-wrap: balance; }
  .label { display: block; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
           color: var(--think); font-weight: 600; margin-bottom: 0.2rem; }
  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 0.45rem; }
  .buttons { display: flex; gap: 0.45rem; }
  button { background: var(--card); border: 1.5px solid #C6D2DC; color: var(--ink); font: inherit;
           font-size: 0.8rem; font-weight: 500; padding: 0.45rem 0.95rem; border-radius: 7px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--think); }
  button.primary { background: var(--think); border-color: var(--think); color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible { outline: 2.5px solid var(--act); outline-offset: 2px; }
  .hint { font-size: 0.7rem; color: var(--muted); }

  .statusbar { display: flex; justify-content: space-between; align-items: center;
               padding: 0.7rem 0; color: var(--muted); font-size: 0.85rem; }
  .statusbar strong { color: var(--ink); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .indicator { padding: 0.18rem 0.75rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; }
  .indicator.idle { background: var(--card); border: 1.5px solid var(--line); color: var(--muted); }
  .indicator.running { background: var(--think-bg); color: var(--think); animation: pulse 1.2s ease-in-out infinite; }
  .indicator.replaying { background: var(--act-bg); color: var(--act); }
  .indicator.done { background: var(--obs-bg); color: var(--obs); }
  .indicator.error { background: var(--err-bg); color: var(--err); }
  @keyframes pulse { 50% { opacity: 0.5; } }

  main { display: grid; grid-template-columns: 1fr 4rem 1fr; column-gap: 0.5rem; row-gap: 0.65rem; align-items: start; }
  .colhead { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
             color: var(--muted); padding: 0.4rem 0 0.15rem; }
  .colhead.left { color: var(--think); } .colhead.right { color: var(--obs); }

  .card { background: var(--card); border-radius: 8px; padding: 0.7rem 0.95rem; font-size: 0.85rem;
          animation: appear 0.25s ease-out; }
  @keyframes appear { from { opacity: 0; transform: translateY(6px); } }
  .tag { display: block; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
         font-weight: 700; margin-bottom: 0.3rem; }
  .think { background: var(--think-bg); border: 1.5px solid var(--think-line); } .think .tag { color: var(--think); }
  .act { background: var(--act-bg); border: 1.5px solid var(--act-line);
         font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.76rem; word-break: break-word; }
  .act .tag { font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; color: var(--act); }
  .act b { color: var(--act); }
  .observe { background: var(--obs-bg); border: 1.5px solid var(--obs-line); } .observe .tag { color: var(--obs); }
  .done { background: var(--done-bg); border: 1.5px solid var(--done-bg); color: var(--done-ink); font-weight: 500; }
  .done .tag { color: var(--done-tag); }
  .error { background: var(--err-bg); border: 1.5px solid var(--err-line); color: var(--err);
           font-weight: 500; grid-column: 1 / -1; }
  .error .tag { color: var(--err); }
  .error-text { color: var(--err); font-weight: 600; }
  .cell.empty { min-height: 0; }

  .gutter { display: flex; align-items: center; justify-content: center; min-height: 3rem; font-size: 1.7rem; }
  .arrow.right { color: var(--act); animation: slideRight 0.9s ease-out; }
  .arrow.left { color: var(--obs); animation: slideLeft 0.9s ease-out; }
  @keyframes slideRight { from { transform: translateX(-2rem); opacity: 0; } }
  @keyframes slideLeft { from { transform: translateX(2rem); opacity: 0; } }

  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 0.3rem; }
  th, td { text-align: left; padding: 0.18rem 0.45rem; border-bottom: 1px solid var(--obs-line); }
  th { color: var(--obs); font-weight: 700; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; }
  td { font-variant-numeric: tabular-nums; }
  td.num { text-align: right; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.15rem 0.8rem; margin: 0.3rem 0 0; font-size: 0.82rem; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 500; }
  pre { white-space: pre-wrap; font-family: inherit; margin: 0.3rem 0 0; }
  .sent { color: var(--obs); font-weight: 700; margin-top: 0.4rem; }
  .cursor { display: inline-block; width: 0.5rem; height: 1rem; background: currentColor;
            vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty-state { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 3rem 0; font-size: 0.9rem; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="goal"><span class="label">Goal</span>{{ goal }}</div>
    <div class="controls">
      <div class="buttons">
        <button class="primary" v-if="!busy" :disabled="!apiKey" @click="start">Start</button>
        <button class="primary" v-else :disabled="pending.length === 0" @click="next">Next ▸{{ pending.length > 1 ? " · " + pending.length : "" }}</button>
        <button :disabled="events.length === 0 || busy" @click="saveRun">Save run</button>
        <button :disabled="busy" @click="$refs.file.click()">Load run</button>
        <input ref="file" type="file" accept=".json,application/json" hidden @change="loadRun">
        <button @click="reset">Reset</button>
      </div>
      <div class="hint" v-if="!apiKey && !busy">No API key found — add demo/env.local.js (see README), or Load a saved run.</div>
      <div class="hint" v-if="busy">→ or Space also advances</div>
    </div>
  </header>

  <div class="statusbar">
    <div>Cycle <strong>{{ cycle }}</strong> · Think → Act → Observe</div>
    <div class="indicator" :class="status">{{ statusLabel }}</div>
  </div>

  <main>
    <div class="colhead left">Model</div>
    <div class="colhead"></div>
    <div class="colhead right">Your code</div>

    <div v-if="rows.length === 0" class="empty-state">Press Start to run the agent, or Load a saved run.</div>

    <template v-for="row in rows" :key="row.key">
      <template v-if="row.error">
        <div class="card error"><span class="tag">Error</span>{{ row.error.message }}</div>
      </template>
      <template v-else>
        <!-- Think row -->
        <div class="cell" v-if="row.reasoning">
          <div class="card think"><span class="tag">Think</span><typewriter :text="row.reasoning.text || '(no explanation given)'"></typewriter></div>
        </div>
        <div class="cell empty" v-if="row.reasoning"></div>
        <div class="cell empty" v-if="row.reasoning"></div>

        <!-- Act / Observe row -->
        <div class="cell" v-if="row.call">
          <div class="card act"><span class="tag">Act · tool request</span><b>{{ row.call.name }}</b>({{ fmtArgs(row.call.args) }})</div>
        </div>
        <div class="cell gutter" v-if="row.call">
          <span v-if="row.result" class="arrow left">⬅</span>
          <span v-else class="arrow right">➜</span>
        </div>
        <div class="cell" v-if="row.call">
          <div class="card observe" v-if="row.result">
            <span class="tag">Observe · result of {{ row.result.name }}</span>
            <tool-result :name="row.result.name" :output="row.result.output"></tool-result>
          </div>
        </div>

        <!-- Done row -->
        <div class="cell" v-if="row.done">
          <div class="card done"><span class="tag">Done</span><typewriter :text="row.done.text || '(no summary given)'"></typewriter></div>
        </div>
        <div class="cell empty" v-if="row.done"></div>
        <div class="cell empty" v-if="row.done"></div>
      </template>
    </template>
  </main>
</div>

<script src="vendor/vue.global.prod.js"></script>
<script src="tools.js"></script>
<script src="agent.js"></script>
<script src="env.local.js"></script><!-- optional, git-ignored: window.OPENAI_API_KEY = "sk-..." (a file-not-found console note is harmless) -->
<script>
  const MAX_TYPE_MS = 3000;        // a whole card finishes typing within this
  const CHAR_MS = 33;              // ~30 chars/s ceiling

  const Typewriter = {
    props: { text: { type: String, default: "" } },
    data() { return { shown: "" }; },
    mounted() {
      const delay = Math.min(CHAR_MS, MAX_TYPE_MS / Math.max(1, this.text.length));
      let i = 0;
      const tick = () => {
        i += 1;
        this.shown = this.text.slice(0, i);
        if (i < this.text.length) this.timer = setTimeout(tick, delay);
      };
      tick();
    },
    unmounted() { clearTimeout(this.timer); },
    template: `<span>{{ shown }}<span v-if="shown.length < text.length" class="cursor"></span></span>`,
  };

  const ToolResult = {
    props: { name: String, output: Object },
    template: `
      <div>
        <div v-if="output && output.error" class="error-text">⚠ {{ output.error }}</div>
        <table v-else-if="name === 'find_journeys'">
          <tr><th>Train</th><th>Departs</th><th>Arrives</th><th>Price</th></tr>
          <tr v-for="j in output.journeys" :key="j.train"><td>{{ j.train }}</td><td>{{ j.departs }}</td><td>{{ j.arrives }}</td><td class="num">{{ j.price_eur }} €</td></tr>
        </table>
        <table v-else-if="name === 'find_hotels'">
          <tr><th>Hotel</th><th>Distance</th><th>Per night</th></tr>
          <tr v-for="h in output.hotels" :key="h.name"><td>{{ h.name }}</td><td class="num">{{ h.distance_km.toFixed(1) }} km</td><td class="num">{{ h.price_eur }} €</td></tr>
        </table>
        <dl v-else-if="name === 'get_site'">
          <dt>Site</dt><dd>{{ output.name }}</dd>
          <dt>Address</dt><dd>{{ output.address }}</dd>
          <dt>Site manager</dt><dd>{{ output.site_manager }}</dd>
        </dl>
        <div v-else-if="name === 'send_itinerary'">
          <pre>{{ output.text }}</pre>
          <div class="sent">✓ sent to {{ output.to }}</div>
        </div>
        <pre v-else>{{ JSON.stringify(output, null, 2) }}</pre>
      </div>`,
  };

  Vue.createApp({
    components: { typewriter: Typewriter, "tool-result": ToolResult },
    data() {
      return { goal: GOAL, apiKey: window.OPENAI_API_KEY || "", events: [], pending: [],
               modelDone: false, status: "idle", runId: 0 };
    },
    computed: {
      busy() { return this.status === "running" || this.status === "replaying"; },
      cycle() { return this.events.reduce((m, e) => Math.max(m, e.cycle || 0), 0); },
      statusLabel() {
        if (this.busy && this.pending.length) return "press Next";
        return { idle: "ready", running: "thinking…", replaying: "replaying…", done: "done", error: "error" }[this.status];
      },
      rows() {
        const byCycle = new Map();
        const rows = [];
        for (const e of this.events) {
          if (e.type === "goal") continue;
          if (e.type === "error") { rows.push({ key: "error-" + rows.length, error: e }); continue; }
          let row = byCycle.get(e.cycle);
          if (!row) { row = { key: "cycle-" + e.cycle, cycle: e.cycle }; byCycle.set(e.cycle, row); rows.push(row); }
          if (e.type === "reasoning") row.reasoning = e;
          else if (e.type === "tool_call") row.call = e;
          else if (e.type === "tool_result") row.result = e;
          else if (e.type === "done") row.done = e;
        }
        return rows;
      },
    },
    watch: {
      "events.length"() {
        this.$nextTick(() => {
          const last = document.querySelector("main > :last-child");
          if (last) last.scrollIntoView({ block: "end", behavior: "smooth" });
        });
      },
    },
    mounted() { window.addEventListener("keydown", this.onKey); },
    unmounted() { window.removeEventListener("keydown", this.onKey); },
    methods: {
      fmtArgs(args) {
        return Object.entries(args || {})
          .map(([k, v]) => `${k}: ${JSON.stringify(typeof v === "string" && v.length > 120 ? v.slice(0, 120) + "…" : v)}`)
          .join(", ");
      },
      async start() {
        const runId = ++this.runId;
        this.events = [];
        this.pending = [];
        this.modelDone = false;
        this.status = "running";
        const t0 = Date.now();
        // Events queue in `pending`; each Next press (or → / Space) reveals one.
        // The goal event is not rendered as a card, so it skips the queue.
        const emit = e => {
          if (runId !== this.runId) return;
          const ev = { ...e, t: Date.now() - t0 };
          if (ev.type === "goal") this.events.push(ev);
          else this.pending.push(ev);
        };
        await runAgent(this.goal, emit, { apiKey: this.apiKey, tools: TOOLS, toolDefs: TOOL_DEFS });
        if (runId !== this.runId) return;
        this.modelDone = true;
        this.maybeFinish(runId);
      },
      next() {
        if (!this.pending.length) return;
        this.events.push(this.pending.shift());
        this.maybeFinish(this.runId);
      },
      maybeFinish(runId) {
        if (runId !== this.runId || !this.modelDone || this.pending.length || !this.busy) return;
        this.status = this.events.some(e => e.type === "error") ? "error" : "done";
      },
      onKey(e) {
        if ((e.key === "ArrowRight" || e.key === " ") && this.busy && this.pending.length) {
          e.preventDefault();
          this.next();
        }
      },
      saveRun() {
        const blob = new Blob([JSON.stringify(this.events, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = `run-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      },
      async loadRun(ev) {
        const file = ev.target.files[0];
        ev.target.value = "";
        if (!file) return;
        let data;
        try { data = validateRun(JSON.parse(await file.text())); }
        catch (e) {
          const message = e.message.startsWith("Not a saved run") ? e.message : "Not a saved run: " + e.message;
          this.events = [{ type: "error", message, t: 0 }]; this.pending = []; this.status = "error"; return;
        }
        const runId = ++this.runId;
        this.events = [];
        this.pending = [];
        this.modelDone = true;   // the whole run is already known; Next steps through it
        this.status = "replaying";
        for (const e of data) {
          if (e.type === "goal") this.events.push(e);
          else this.pending.push(e);
        }
        this.maybeFinish(runId);
      },
      reset() {
        this.runId += 1;
        this.events = [];
        this.pending = [];
        this.modelDone = false;
        this.status = "idle";
      },
    },
  }).mount("#app");
</script>
</body>
</html>
